name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # necesario para crear el release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Verificar que el módulo importa
        run: python -c "import scanner_app; print('import OK')"

      - name: Build (archivo único)
        run: pyinstaller --noconfirm AntigravityScanner.spec

      # Compilar sin error no significa que el .exe funcione: numpy y OpenCV
      # cargan sus DLLs recién al importarse. Acá se ejecuta el binario real.
      - name: Verificar que el ejecutable carga sus DLLs
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\dist\AntigravityScanner.exe -ArgumentList '--selftest' -Wait -PassThru
          if (Test-Path .\dist\selftest.log) { Get-Content .\dist\selftest.log }
          if ($p.ExitCode -ne 0) { Write-Error "El ejecutable no pasa el selftest"; exit 1 }

      - name: Build (carpeta, plan B para antivirus restrictivo)
        run: pyinstaller --noconfirm AntigravityScanner-carpeta.spec

      - name: Verificar la variante en carpeta
        shell: pwsh
        run: |
          $exe = '.\dist\AntigravityScanner\AntigravityScanner.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru
          $log = '.\dist\AntigravityScanner\selftest.log'
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { Write-Error "La variante en carpeta no pasa el selftest"; exit 1 }
          Compress-Archive -Path .\dist\AntigravityScanner -DestinationPath .\dist\AntigravityScanner-carpeta.zip -Force

      - name: Publicar artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityScanner
          path: |
            dist/AntigravityScanner.exe
            dist/AntigravityScanner-carpeta.zip
          if-no-files-found: error
          retention-days: 30

      # Sólo cuando se pushea un tag vXXX. Un push normal a main deja
      # únicamente el artifact, que es lo que se quiere para probar.
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          dist/AntigravityScanner.exe
          dist/AntigravityScanner-carpeta.zip
          --title "Antigravity Scanner ${{ github.ref_name }}"
          --generate-notes
