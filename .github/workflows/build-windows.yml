name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Verificar que el módulo importa
        run: python -c "import scanner_app; print('import OK')"

      - name: Build
        run: pyinstaller --noconfirm AntigravityScanner.spec

      - name: Publicar el .exe
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityScanner
          path: dist/AntigravityScanner.exe
          if-no-files-found: error
          retention-days: 30
