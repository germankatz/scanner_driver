name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # necesario para crear el release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Verificar que el módulo importa
        run: python -c "import scanner_app; print('import OK')"

      - name: Build
        run: pyinstaller --noconfirm AntigravityScanner.spec

      - name: Publicar el .exe
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityScanner
          path: dist/AntigravityScanner.exe
          if-no-files-found: error
          retention-days: 30

      # Sólo cuando se pushea un tag vXXX. Un push normal a main deja
      # únicamente el artifact, que es lo que se quiere para probar.
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          dist/AntigravityScanner.exe
          --title "Antigravity Scanner ${{ github.ref_name }}"
          --generate-notes
